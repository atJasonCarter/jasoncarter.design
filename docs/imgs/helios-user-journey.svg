<text x="56" y="538" font-size="12" font-weight="700" letter-spacing="1.6" fill="#8d8699">GOAL</text>
<text x="56" y="562" font-size="16" font-style="italic" fill="#cfc9dc">One template that fits</text>
<text x="56" y="582" font-size="16" font-style="italic" fill="#cfc9dc">any company</text>
