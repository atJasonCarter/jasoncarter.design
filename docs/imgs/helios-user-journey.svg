<text x="668" y="342" font-size="17" fill="#e0dbea">self review</text>
<line x1="646" x2="646" y1="398" y2="432" stroke="#fbbf24" stroke-opacity=".25" stroke-width="1.5"/>
<circle cx="646" cy="389" r="9" fill="#1c1925" stroke="#fbbf24" stroke-opacity=".6" stroke-width="1.5"/><circle cx="646" cy="389" r="3" fill="#fbbf24"/>
<text x="668" y="394" font-size="17" fill="#e0dbea">Review teammates</text>
<circle cx="646" cy="441" r="9" fill="#1c1925" stroke="#fbbf24" stroke-opacity=".6" stroke-width="1.5"/><circle cx="646" cy="441" r="3" fill="#fbbf24"/>
