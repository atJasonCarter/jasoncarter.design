<line x1="640" x2="852" y1="512" y2="512" stroke="#322c40"/>
<text x="640" y="538" font-size="12" font-weight="700" letter-spacing="1.6" fill="#8d8699">GOAL</text>
<text x="640" y="562" font-size="16" font-style="italic" fill="#cfc9dc">Honest input,</text>
<text x="640" y="582" font-size="16" font-style="italic" fill="#cfc9dc">low effort</text>
<line x1="746.0" x2="746.0" y1="600" y2="644" stroke="#fbbf24" stroke-opacity=".5" stroke-width="2"/>
<circle cx="746.0" cy="652" r="8" fill="#14121b" stroke="#fbbf24" stroke-width="3"/>
<rect x="910" y="118" width="256" height="482" rx="22" fill="#1c1925" stroke="#322c40" stroke-width="1.5"/>
<circle cx="948" cy="166" r="17" fill="#5eead4"/><text x="948" y="172" font-size="17" font-weight="800" text-anchor="middle" fill="#14121b">4</text>
<text x="976" y="171" font-size="14" font-weight="700" letter-spacing="1.8" fill="#5eead4">MANAGER</text>
