<text x="376" y="416" font-size="17" fill="#e0dbea">and teammates</text>
<circle cx="354" cy="463" r="9" fill="#1c1925" stroke="#5eead4" stroke-opacity=".6" stroke-width="1.5"/><circle cx="354" cy="463" r="3" fill="#5eead4"/>
