<rect x="618" y="118" width="256" height="482" rx="22" fill="#1c1925" stroke="#322c40" stroke-width="1.5"/>
<circle cx="656" cy="166" r="17" fill="#fbbf24"/><text x="656" y="172" font-size="17" font-weight="800" text-anchor="middle" fill="#14121b">3</text>
