<text x="600.0" y="657" font-size="15" font-weight="600" text-anchor="middle" fill="#e0dbea">Assigned review</text>
<rect x="834.0" y="635" width="116" height="34" rx="17" fill="#241f31" stroke="#4a4160"/>
<text x="892.0" y="657" font-size="15" font-weight="600" text-anchor="middle" fill="#e0dbea">Responses</text>
