<circle cx="938" cy="337" r="9" fill="#1c1925" stroke="#5eead4" stroke-opacity=".6" stroke-width="1.5"/><circle cx="938" cy="337" r="3" fill="#5eead4"/>
<text x="960" y="342" font-size="17" fill="#e0dbea">Read responses</text>
<text x="960" y="364" font-size="17" fill="#e0dbea">side by side</text>
<line x1="938" x2="938" y1="420" y2="476" stroke="#5eead4" stroke-opacity=".25" stroke-width="1.5"/>
<circle cx="938" cy="411" r="9" fill="#1c1925" stroke="#5eead4" stroke-opacity=".6" stroke-width="1.5"/><circle cx="938" cy="411" r="3" fill="#5eead4"/>
<text x="960" y="416" font-size="17" fill="#e0dbea">Write the review</text>
<text x="960" y="438" font-size="17" fill="#e0dbea">and rating</text>
<circle cx="938" cy="485" r="9" fill="#1c1925" stroke="#5eead4" stroke-opacity=".6" stroke-width="1.5"/><circle cx="938" cy="485" r="3" fill="#5eead4"/>
<text x="960" y="490" font-size="17" fill="#e0dbea">Share it in a 1:1</text>
<line x1="932" x2="1144" y1="512" y2="512" stroke="#322c40"/>
<text x="932" y="538" font-size="12" font-weight="700" letter-spacing="1.6" fill="#8d8699">GOAL</text>
<text x="932" y="562" font-size="16" font-style="italic" fill="#cfc9dc">A conversation,</text>
<text x="932" y="582" font-size="16" font-style="italic" fill="#cfc9dc">not paperwork</text>
<line x1="1038.0" x2="1038.0" y1="600" y2="635" stroke="#5eead4" stroke-opacity=".5" stroke-width="2"/>
<rect x="235.0" y="635" width="146" height="34" rx="17" fill="#241f31" stroke="#4a4160"/>
<text x="308.0" y="657" font-size="15" font-weight="600" text-anchor="middle" fill="#e0dbea">Review template</text>
