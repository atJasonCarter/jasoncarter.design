<circle cx="62" cy="337" r="9" fill="#1c1925" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/><circle cx="62" cy="337" r="3" fill="#a78bfa"/>
<text x="84" y="342" font-size="17" fill="#e0dbea">Add questions and</text>
<text x="84" y="364" font-size="17" fill="#e0dbea">response types</text>
<line x1="62" x2="62" y1="420" y2="476" stroke="#a78bfa" stroke-opacity=".25" stroke-width="1.5"/>
<circle cx="62" cy="411" r="9" fill="#1c1925" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/><circle cx="62" cy="411" r="3" fill="#a78bfa"/>
