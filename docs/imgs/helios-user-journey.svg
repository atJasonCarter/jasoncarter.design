<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Helios review cycle user journey</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171421"/><stop offset="1" stop-color="#110f18"/></linearGradient></defs>
<rect width="1200" height="700" rx="24" fill="url(#bg)"/>
<text x="34" y="60" font-size="28" font-weight="700" fill="#f2eefc">One review cycle, four hand-offs</text>
<text x="34" y="90" font-size="17" fill="#a49db3">How a template becomes a completed review across admin, manager, and employee</text>
<line x1="162.0" x2="1038.0" y1="652" y2="652" stroke="#3a3350" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
<rect x="34" y="118" width="256" height="482" rx="22" fill="#1c1925" stroke="#322c40" stroke-width="1.5"/>
<circle cx="72" cy="166" r="17" fill="#a78bfa"/><text x="72" y="172" font-size="17" font-weight="800" text-anchor="middle" fill="#14121b">1</text>
<text x="100" y="171" font-size="14" font-weight="700" letter-spacing="1.8" fill="#a78bfa">ADMIN</text>
<text x="56" y="222" font-size="19.5" font-weight="700" fill="#f2eefc">Creates the template</text>
<line x1="62" x2="62" y1="272" y2="328" stroke="#a78bfa" stroke-opacity=".25" stroke-width="1.5"/>
<circle cx="62" cy="263" r="9" fill="#1c1925" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/><circle cx="62" cy="263" r="3" fill="#a78bfa"/>
